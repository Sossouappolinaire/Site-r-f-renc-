services:
  - type: web
    name: coeur-connexions
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_EMAIL
        value: sossoukouam@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Cœur & Connexions <onboarding@resend.dev>