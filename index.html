    .shell{min-height:100vh;background:radial-gradient(circle at 95% 0,#e1ebff 0,transparent 26%),#f4f7fb}.bar{background:#0c111b;color:#fff}.bar-in{display:flex;justify-content:space-between;align-items:center;padding:13px 0}.bar .mark{background:#3c74dd}.who{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#26395e;color:#a8c8ff;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.work{padding:40px 0}.layout{display:grid;grid-template-columns:210px 1fr;gap:26px}.side{align-self:start;position:sticky;top:20px}.side b{display:block;color:#8492a8;font-size:10px;text-transform:uppercase;letter-spacing:.15em;margin:0 0 9px}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#71809a;border-radius:10px;padding:10px 12px;font-weight:700;margin-bottom:3px}.side button.active,.side button:hover{background:#dfebff;color:#225fbe}.welcome{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.welcome h2{font:500 clamp(30px,4vw,48px)/1.05 "Playfair Display",serif;color:#172b4d;margin:8px 0}.welcome p{color:#74839a;margin:0}.pill{display:inline-flex;padding:6px 10px;border-radius:99px;background:#dff8ee;color:#178368;font-size:11px;font-weight:800;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:16px}.metric,.panel{border:0;background:#f3f7fc;box-shadow:10px 12px 28px #cbd5e224,-8px -8px 22px #fff;border-radius:18px;padding:20px}.metric strong{display:block;font:600 31px "Playfair Display",serif;color:#1d3761}.metric span{color:#74839a;font-size:12px}.panel h3{color:#172b4d;margin:0}.panel>p{color:#74839a;font-size:13px}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.row{padding:14px 0;border-bottom:1px solid #dee7f1}.row:last-child{border-bottom:0}.row time{font-size:10px;color:var(--rose);font-weight:800}.row margin:auto}.auth{grid-template-columns:1fr}.visual{display:none}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:4px;position:static}.side b{display:none}.side button{white-space:nowrap;width:auto}.split{grid-template-columns:1fr}}@media(max-width:590px){.wrap{width:calc(100% - 24px)}.nav{flex-wrap:wrap;gap:12px}.actions{width:100%}.actions .btn{flex:1;padding:10px 8px;font-size:12px}.hero h1{font-size:54px}.hero-art{height:350px}.art{inset:28px 28px 18px 48px}.grid,.mail-fields{grid-template-columns:1fr}.full,.mail-fields .full{grid-column:auto}.card{padding:22px}.form-foot,.welcome{align-items:flex-start;flex-direction:column}.form-foot .btn{width:100%}.metrics{grid-template-columns:1fr}.footer{display:block}.footer span{display:block;margin-top:5px}}
    .glass{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#070a14;position:relative;overflow:hidden;color:#fff}.glass .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.9;pointer-events:none}.b1{width:340px;height:340px;background:#1f8fff;top:-90px;left:-70px}.b2{width:300px;height:300px;background:#2de2b0;top:12%;right:-90px}.b3{width:340px;height:340px;background:#c21fe0;bottom:-110px;right:8%}.glass-in{position:relative;z-index:1;width:min(100%,440px)}
    .glass .card{width:100%;background:rgba(14,16,28,.62);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid #ffffff1f;color:#fff;box-shadow:0 30px 80px #0008}.glass .card h2{color:#fff}.glass .card>p,.glass .muted{color:#b9c3d6}.glass .kicker{color:#2de2b0}.glass .brand{color:#fff}.glass .mark{background:linear-gradient(135deg,#1f8fff,#7b2ff7)}.glass .field label{color:#2de2b0;letter-spacing:0;font-size:12px}.glass input,.glass select{background:#ffffff0d;border-color:#ffffff26;color:#fff}.glass input:focus,.glass select:focus{border-color:#2de2b0;box-shadow:0 0 0 3px #2de2b02e}.glass .alert{background:#ff4d6d26;color:#ffb3c1}.glass .btn.primary{background:linear-gradient(90deg,#1f9bff,#7b2ff7);color:#fff}.glass .check{color:#b9c3d6}.glass .check input{width:auto}.glass option{color:#111}
    .lg{text-align:center}.lg .logo{width:78px;height:78px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:700;background:linear-gradient(135deg,#1f8fff,#7b2ff7);box-shadow:0 0 0 6px #ffffff14}.lg h2{margin:0 0 6px;font:700 clamp(30px,8vw,38px)/1.1 "DM Sans",sans-serif}.lg .sub{color:#b9c3d6;margin:0 0 26px;font-size:14px}.fl{position:relative;margin-top:18px;text-align:left}.glass .fl input{height:58px;border-radius:16px;padding:18px 16px 6px}.fl label{position:absolute;left:14px;top:18px;padding:0 6px;color:#b9c3d6;font-size:15px;pointer-events:none;transition:.18s;border-radius:6px}.fl input:focus+label,.fl input:not(:placeholder-shown)+label{top:-9px;font-size:12px;color:#2de2b0;background:#10162a}

    .modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(3,5,12,.8);backdrop-filter:blur(6px)}.modal-box{width:min(100%,400px);text-align:center;background:#12162a;border:1px solid #ffffff22;border-radius:22px;padding:28px 22px;color:#fff}.modal-box h3{margin:0 0 8px;font-size:22px}.modal-box p{color:#b9c3d6;font-size:14px;margin:0}.modal-code{font:700 38px/1 ui-monospace,monospace;letter-spacing:.2em;margin:18px 0 8px;padding:16px 8px;border-radius:14px;background:#ffffff0f;border:1px dashed #2de2b0;color:#2de2b0;user-select:all}.modal-box .btn{width:100%;margin-top:10px}.modal-box .btn.primary{background:linear-gradient(90deg,#1f9bff,#7b2ff7)}.modal-box .btn.light{background:transparent;color:#fff;border-color:#ffffff33}
    .modal-box.mail-msg{text-align:left;width:min(100%,460px);max-height:92vh;overflow:auto}.mail-msg h3{font-size:21px}.mail-msg .mm-sub{font-size:12px;margin-bottom:14px}.mail-msg p{margin:0 0 10px;color:#d6deec}.mail-msg .modal-code{text-align:center}.mail-msg .mm-note{font-size:12px;color:#9aa6bb}.mm-check{display:flex;gap:10px;align-items:flex-start;margin:14px 0 6px;font-size:14px;color:#fff}.mm-check input{width:auto;margin-top:3px;accent-color:#2de2b0}.modal-box .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:#b7c0cf}.dot.on{background:#1fbf86;box-shadow:0 0 0 4px #1fbf8626}.pw-actions{display:flex;gap:8px;margin-top:10px}.reset-code{margin-top:8px;font:700 28px ui-monospace,monospace;letter-spacing:.2em;color:#225fbe}

<body>
  <div id="progressOverlay" class="progress-overlay hidden" aria-live="polite">
    <div class="progress-card">
      <strong id="progressTitle">Ouverture en cours</strong>
      <p id="progressMessage">Préparation de votre espace…</p>
      <div class="progress-track"><div id="progressValue" class="progress-value"></div></div>
      <span id="progressNumber" class="progress-number">0%</span>
    </div>
  </div>
  <div id="root"></div><div id="toast" class="toast hidden"></div>
  <script>
    const root=document.getElementById("root"),toastEl=document.getElementById("toast");
    const state={user:null,role:null,view:"dashboard",users:[],messages:[],announcements:[],pwRequests:[],pendingEmail:"",pendingResetEmail:"",resetDelivery:""};
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const initials=u=>((u?.firstName||"C")[0]+(u?.lastName||"C")[0]).toUpperCase();
    const fmt=v=>new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(v));
    async function api(url,options={}){const r=await fetch(url,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options});let x={};try{x=await r.json()}catch(_e){}if(!r.ok)throw Error(x.error||"Une erreur est survenue.");return x}
    function toast(msg,good=false){toastEl.textContent=msg;toastEl.style.background=good?"#277458":"#24172e";toastEl.classList.remove("hidden");clearTimeout(window._toast);window._toast=setTimeout(()=>toastEl.classList.add("hidden"),4000)}
    function go(route){location.hash=route;render()}
    function runWithProgress(target){
      if(window.progressBusy)return;
      window.progressBusy=true;
      const overlay=document.getElementById("progressOverlay"),valueEl=document.getElementById("progressValue"),numberEl=document.getElementById("progressNumber"),titleEl=document.getElementById("progressTitle"),messageEl=document.getElementById("progressMessage");
      const label=(target.textContent||"Ouverture").replace(/\s+/g," ").trim().slice(0,48)||"Ouverture";
      titleEl.textContent=label;
      messageEl.textContent="Préparation de votre espace…";
      valueEl.style.width="0%";numberEl.textContent="0%";overlay.classList.remove("hidden");
      const steps=["Vérification de l’action…","Chargement de la page…","Préparation de votre espace…","Presque terminé…"];
      let progress=0;
      const timer=setInterval(()=>{
        progress=Math.min(100,progress+8+Math.ceil(Math.random()*9));
        valueEl.style.width=`${progress}%`;numberEl.textContent=`${progress}%`;
        messageEl.textContent=steps[Math.min(3,Math.floor(progress/26))];
        if(progress>=100){
          clearInterval(timer);
          setTimeout(()=>{
            overlay.classList.add("hidden");
            window.progressBypass=true;
            target.click();
            window.progressBypass=false;
            window.progressBusy=false;
          },180);
        }
      },90);
    }
    function authFrame(content){return `<div class="glass"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><main class="glass-in">${content}</main></div>`}
    function codeModal(code,name,next){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="modal-box mail-msg" role="dialog" aria-modal="true"><h3>♡ Votre espace est confirmé</h3><p class="mm-sub">Message de Cœur & Connexions</p><p><b>Bonjour ${esc(name||"")},</b></p><p>Votre espace est maintenant confirmé par l’équipe. Lors de votre première connexion, saisissez le code secret ci-dessous :</p><div class="modal-code">${esc(code)}</div><p>Ce code est personnel, à usage unique et valable 30 jours. Ne le partagez avec personne.</p><p class="mm-note">Cœur & Connexions facilite la prise de contact mais ne garantit ni l’identité, ni les intentions, ni le comportement des utilisateurs.</p><label class="mm-check"><input type="checkbox" id="acceptTerms"><span>J’accepte les conditions de discrétion et de responsabilité.</span></label><button class="btn primary" data-progress-ignore="true" id="copyCode" disabled>Copier le code</button><button class="btn light" data-progress-ignore="true" id="closeCode" disabled>Continuer vers la connexion</button></div>`;document.body.appendChild(m);const acc=m.querySelector("#acceptTerms"),copy=m.querySelector("#copyCode"),close=m.querySelector("#closeCode");acc.onchange=()=>{copy.disabled=close.disabled=!acc.checked};copy.onclick=async()=>{try{await navigator.clipboard.writeText(code)}catch(_e){const r=document.createRange();r.selectNodeContents(m.querySelector(".modal-code"));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand("copy")}copy.textContent="Code copié ✓"};close.onclick=()=>{m.remove();next()}}
    function login(){root.innerHTML=authFrame(`<div class="card lg"><div class="logo">♡</div><h2>Bon retour</h2><p class="sub">Connectez-vous pour poursuivre votre parcours</p><form id="login"><div class="fl"><input id="lEmail" name="email" type="email" placeholder=" " autocomplete="email" required><label for="lEmail">Adresse e-mail</label></div><div class="fl"><input id="lPass" name="password" type="password" placeholder=" " autocomplete="current-password" required><label for="lPass">Mot de passe</label></div><div class="lg-row"><label><input name="remember" type="checkbox">Se souvenir de moi</label><a href="#" onclick="go('mot-de-passe-oublie')">Mot de passe oublié ?</a></div><div id="error"></div><button class="btn primary">Se connecter</button></form><p class="lg-foot">Pas encore de compte ? <a href="#" onclick="go('inscription')">Créer un compte</a></p></div>`);document.getElementById("login").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const r=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:f.get("email"),password:f.get("password"),remember:f.get("remember")==="on"})});if(r.requiresCode){state.pendingEmail=f.get("email");return r.loginCode?codeModal(r.loginCode,r.user?.firstName,codePage):codePage()}state.user=r.user;state.role=r.role;go(r.role==="admin"?"admin":"espace")}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function codePage(){root.innerHTML=authFrame(`<div class="card"><div class="top"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><a class="muted" href="#" onclick="go('connexion')">Retour</a></div><span class="kicker">Dernière vérification</span><h2>Votre code secret.</h2><p>Saisissez le code à 6 chiffres affiché lors de votre inscription.</p><form id="code"><div class="field"><label>CODE À 6 CHIFFRES</label><input name="code" inputmode="numeric" maxlength="6" pattern="\\d{6}" required></div><div id="error"></div><button class="btn primary" style="width:100%;margin-top:18px">Ouvrir mon espace →</button></form></div>`,"La confiance commence par un espace sécurisé.");document.getElementById("code").onsubmit=async e=>{e.preventDefault();try{const r=await api("/api/auth/verify-code",{method:"POST",body:JSON.stringify({code:new FormData(e.target).get("code")})});state.user=r.user;state.role="user";go("espace")}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function forgotPassword(){root.innerHTML=authFrame(`<div class="card"><div class="top"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><a class="muted" href="#" onclick="go('connexion')">Retour</a></div><span class="kicker">Accès à votre espace</span><h2>Mot de passe oublié ?</h2><p>Saisissez l’adresse e-mail de votre compte. Nous vérifierons ensuite votre numéro de téléphone.</p><form id="forgotPassword"><div class="field"><label>ADRESSE EMAIL</label><input name="email" type="email" required></div><div id="error"></div><button class="btn primary" style="width:100%;margin-top:18px">Continuer →</button></form></div>`,"Retrouvez votre espace en toute sécurité.");document.getElementById("forgotPassword").onsubmit=async e=>{e.preventDefault();const email=String(new FormData(e.target).get("email")||"").trim().toLowerCase();try{if(!email)throw Error("Saisissez une adresse e-mail valide.");state.pendingResetEmail=email;resetPhonePage()}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function resetPhonePage(){root.innerHTML=authFrame(`<div class="card"><div class="top"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><a class="muted" href="#" onclick="go('mot-de-passe-oublie')">Retour</a></div><span class="kicker">Vérification</span><h2>Confirmez votre numéro.</h2><p>Saisissez le numéro de téléphone indiqué lors de votre inscription.</p><form id="resetPhone"><div class="field"><label>NUMÉRO DE TÉLÉPHONE</label><input name="phone" type="tel" inputmode="tel" autocomplete="tel" required></div><div id="error"></div><button class="btn primary" style="width:100%;margin-top:18px">Vérifier mon numéro →</button></form></div>`);document.getElementById("resetPhone").onsubmit=async e=>{e.preventDefault();try{const r=await api("/api/auth/forgot-password",{method:"POST",body:JSON.stringify({email:state.pendingResetEmail,phone:new FormData(e.target).get("phone")})});resetModal(r.resetCode,resetCodePage)}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function resetModal(code,next){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true"><h3>Votre code de réinitialisation</h3><p>Numéro vérifié. Saisissez ce code à l’étape suivante : il est valable 1 heure et à usage unique.</p><div class="modal-code">${esc(code)}</div><button class="btn primary" data-progress-ignore="true" id="copyReset">Copier le code</button><button class="btn light" data-progress-ignore="true" id="nextReset">Continuer</button></div>`;document.body.appendChild(m);const copy=m.querySelector("#copyReset");copy.onclick=async()=>{try{await navigator.clipboard.writeText(code)}catch(_e){const r=document.createRange();r.selectNodeContents(m.querySelector(".modal-code"));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand("copy")}copy.textContent="Code copié ✓"};m.querySelector("#nextReset").onclick=()=>{m.remove();next()}}
    function doneModal(next){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true"><h3>Mot de passe modifié</h3><p>Votre mot de passe a été modifié. Vous pouvez vous connecter à votre compte, mais vous ne pourrez pas recevoir les notifications s’il y a un client.</p><button class="btn primary" data-progress-ignore="true" id="doneNext">Aller à la connexion</button></div>`;document.body.appendChild(m);m.querySelector("#doneNext").onclick=()=>{m.remove();next()}}
    function whatsappModal(url,next){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="modal-box" role="dialog" aria-modal="true"><h3>Demande envoyée</h3><p>Votre compte est en attente de confirmation par l’administrateur. Prévenez-le sur WhatsApp : vous pourrez vous connecter dès sa confirmation.</p><a class="btn primary" data-progress-ignore="true" href="${esc(url)}" target="_blank" rel="noopener">Ouvrir WhatsApp</a><button class="btn light" data-progress-ignore="true" id="waNext">Retour à la connexion</button></div>`;document.body.appendChild(m);window.open(url,"_blank","noopener");m.querySelector("#waNext").onclick=()=>{m.remove();next()}}
    function resetCodePage(){const note="Saisissez le code qui vient de s’afficher. Il est valable 1 heure et ne peut être utilisé qu’une seule fois.";root.innerHTML=authFrame(`<div class="card"><div class="top"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><a class="muted" href="#" onclick="go('mot-de-passe-oublie')">Retour</a></div><span class="kicker">Vérification</span><h2>Votre code de réinitialisation.</h2><p>${note}</p><form id="resetCode"><div class="field"><label>CODE À 6 CHIFFRES</label><input name="code" inputmode="numeric" maxlength="6" pattern="\\d{6}" required></div><div id="error"></div><button class="btn primary" style="width:100%;margin-top:18px">Vérifier le code →</button></form></div>`,"Un nouveau départ commence ici.");document.getElementById("resetCode").onsubmit=async e=>{e.preventDefault();try{await api("/api/auth/verify-reset-code",{method:"POST",body:JSON.stringify({email:state.pendingResetEmail,code:new FormData(e.target).get("code")})});newPasswordPage()}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function newPasswordPage(){root.innerHTML=authFrame(`<div class="card"><div class="top"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><span class="muted">Dernière étape</span></div><span class="kicker">Sécurité du compte</span><h2>Choisissez un nouveau mot de passe.</h2><p>Utilisez au moins 8 caractères. Il remplacera définitivement l’ancien.</p><form id="newPassword"><div class="field"><label>NOUVEAU MOT DE PASSE</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>CONFIRMATION</label><input name="passwordConfirmation" type="password" minlength="8" required></div><div id="error"></div><button class="btn primary" style="width:100%;margin-top:18px">Enregistrer le nouveau mot de passe →</button></form></div>`,"Votre compte reste protégé à chaque étape.");document.getElementById("newPassword").onsubmit=async e=>{e.preventDefault();try{const r=await api("/api/auth/reset-password",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});r.whatsapp?whatsappModal(r.whatsapp,()=>go("connexion")):doneModal(()=>go("connexion"))}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function register(){root.innerHTML=authFrame(`<div class="card"><div class="top"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><a class="muted" href="#" onclick="go('')">Retour</a></div><span class="kicker">Votre histoire commence ici</span><h2>Créer votre espace.</h2><p>Quelques informations et une photo de profil : votre compte est actif dès l’inscription.</p><form id="register"><div class="grid"><div class="field"><label>PRÉNOM</label><input name="firstName" required></div><div class="field"><label>NOM</label><input name="lastName" required></div><div class="field"><label>TÉLÉPHONE</label><input name="phone" required></div><div class="field"><label>EMAIL</label><input name="email" type="email" required></div><div class="field"><label>MOT DE PASSE</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>CONFIRMATION</label><input name="passwordConfirmation" type="password" minlength="8" required></div><div class="field"><label>JE SUIS</label><select name="gender"><option value="femme">Une femme</option><option value="homme">Un homme</option><option value="autre">Autre</option></select></div><div class="field"><label>JE SOUHAITE RENCONTRER</label><select name="encounterType"><option value="femme">Une femme</option><option value="homme">Un homme</option><option value="tous">Tout profil compatible</option></select></div><div class="field full"><label>PHOTO DE PROFIL OBLIGATOIRE</label><input name="profilePhoto" type="file" accept="image/*" required><span class="muted">Elle sera utilisée comme votre photo de profil, comme sur Facebook.</span></div></div><label class="check"><input name="termsAccepted" type="checkbox" required><span>J’accepte les conditions de discrétion et de responsabilité.</span></label><div id="error"></div><div class="form-foot"><span class="muted">Accès immédiat, sans validation.</span><button class="btn primary">Créer mon compte →</button></div></form></div>`,"Une belle histoire mérite un bon départ.");document.getElementById("register").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const photo=f.get("profilePhoto");if(!photo?.size)throw Error("Ajoutez une photo de profil pour continuer.");const x=Object.fromEntries(f);x.profilePhoto=await fileData(photo);x.termsAccepted=f.get("termsAccepted")==="on";const r=await api("/api/auth/register",{method:"POST",body:JSON.stringify(x)});codeModal(r.loginCode,x.firstName,()=>go("connexion"))}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function bar(){return `<div class="bar"><div class="wrap bar-in"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><div class="who"><span class="avatar">${state.user?.profilePhoto?`<img src="${esc(state.user.profilePhoto)}" alt="Photo de profil">`:initials(state.user)}</span><span><b>${esc(state.user?.firstName||"Équipe")}</b><br><small>${state.role==="admin"?"Administration":"Espace privé"}</small></span><button class="btn light small" onclick="logout()">Quitter</button></div></div></div>`}
    function shell(items,content){return `<div class="shell">${bar()}<main class="wrap work"><div class="layout"><aside class="side"><b>${state.role==="admin"?"Pilotage":"Mon espace"}</b>${items}</aside><section>${content}</section></div></main></div>`}
    async function loadUser(){[state.user,state.announcements,state.messages]=await Promise.all([api("/api/me"),api("/api/announcements"),api("/api/messages")])}
    function userPage(){const items=`<button class="${state.view==="dashboard"?"active":""}" onclick="state.view='dashboard';userPage()">Vue d’ensemble</button><button class="${state.view==="plan"||state.view==="chat"?"active":""}" onclick="state.view='plan';userPage()">Plan de ce soir</button><button class="${state.view==="messages"?"active":""}" onclick="state.view='messages';userPage()">Messages</button><button class="${state.view==="photos"?"active":""}" onclick="state.view='photos';userPage()">Mes photos</button>`;let content=`<div class="welcome"><div><span class="kicker">Espace privé</span><h2>Bonjour ${esc(state.user.firstName)}.</h2><p>Chaque étape reste entre vos mains.</p></div><span class="pill">Compte confirmé</span></div>`;if(state.view==="plan"||state.view==="chat")content+=planPanel();else if(state.view==="messages")content+=`<div class="panel"><h3>Échanges avec l’équipe</h3><div>${state.messages.map(m=>`<div class="row"><b>${m.senderRole==="admin"?"Équipe":"Vous"}</b><p>${esc(m.body)}</p><small class="muted">${fmt(m.createdAt)}</small></div>`).join("")||"<p>Aucun message pour le moment.</p>"}</div><form id="message" style="margin-top:14px"><textarea name="body" required placeholder="Écrivez votre message…"></textarea><button class="btn primary" style="margin-top:10px">Envoyer</button></form></div>`;else if(state.view==="photos")content+=`<div class="panel"><h3>Vos trois photos privées</h3><p>Ajoutez exactement trois photos pour permettre une mise en relation personnalisée.</p><input id="photos" type="file" accept="image/*" multiple><button class="btn primary" style="margin-top:14px" onclick="savePhotos()">Enregistrer mes photos</button></div>`;else content+=`<div class="metrics"><div class="metric"><strong>${state.announcements.length}</strong><span>annonces de l’équipe</span></div><div class="metric"><strong>${state.messages.length}</strong><span>messages privés</span></div><div class="metric"><strong>${state.user.photoCount}/3</strong><span>photos ajoutées</span></div></div><div class="split"><div class="panel"><h3>Les nouvelles de l’équipe</h3>${state.announcements.map(a=>`<div class="row"><time>${fmt(a.createdAt)}</time><h4>${esc(a.title)}</h4><p>${esc(a.body)}</p></div>`).join("")}</div><div class="panel"><h3>Votre confidentialité</h3><p>Votre profil reste privé. Les photos ne sont révélées qu’après votre accord et la confirmation de l’équipe.</p><button class="btn pink" onclick="state.view='photos';userPage()">Ajouter mes 3 photos</button></div></div>`;root.innerHTML=shell(items,content);document.getElementById("message")?.addEventListener("submit",sendMessage);if(state.view==="plan"||state.view==="chat")planLoad();else clearInterval(PL.chatTimer)}
    async function sendMessage(e){e.preventDefault();try{await api("/api/messages",{method:"POST",body:JSON.stringify({body:new FormData(e.target).get("body")})});await loadUser();toast("Message envoyé.",true);userPage()}catch(x){toast(x.message)}}
    function fileData(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL("image/jpeg",0.85))};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Image illisible."))};img.src=url})}
    async function savePhotos(){const files=[...(document.getElementById("photos")?.files||[])];if(files.length!==3)return toast("Sélectionnez exactement trois photos.");try{state.user=await api("/api/profile/photos",{method:"POST",body:JSON.stringify({photos:await Promise.all(files.map(fileData))})});toast("Photos enregistrées.",true);userPage()}catch(x){toast(x.message)}}

    function dur(iso){if(!iso)return"";const m=Math.floor(Math.max(0,Date.now()-new Date(iso))/60000);if(m<1)return"moins d’une minute";if(m<60)return`${m} min`;const h=Math.floor(m/60);if(h<24)return`${h} h ${String(m%60).padStart(2,"0")}`;const d=Math.floor(h/24);return`${d} j`}

    function adminPage(){const i=state.view;const online=state.users.filter(u=>u.online);const n=state.pwRequests.length;const items=`<button class="${i==="dashboard"?"active":""}" onclick="state.view='dashboard';adminPage()">Tableau de bord</button><button id="navPlans" class="${i==="plans"?"active":""}" onclick="state.view='plans';adminPage()">Plan de mes clients</button><button class="${i==="chats"?"active":""}" onclick="state.view='chats';adminPage()">Discussions de mes clients</button><button class="${i==="users"?"active":""}" onclick="state.view='users';adminPage()">Profils inscrits</button><button class="${i==="resets"?"active":""}" onclick="state.view='resets';adminPage()">Nouveaux mots de passe${n?` (${n})`:""}</button>`;let content=`<div class="welcome"><div><span class="kicker">Espace équipe</span><h2>Bonjour, équipe.</h2><p>Suivez les inscriptions, la présence des membres et confirmez les nouveaux mots de passe.</p></div><span class="pill">Administration</span></div>`;
      if(i==="plans"||i==="chats")content+=adminPlanPanel();else if(i==="users")content+=`<div class="panel"><h3>Personnes inscrites</h3><p>Les comptes sont actifs dès l’inscription. La présence se met à jour automatiquement.</p><div class="table-wrap"><table class="table"><thead><tr><th>Nom</th><th>Email</th><th>Téléphone</th><th>Inscrit le</th><th>Présence</th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${esc(u.firstName+" "+u.lastName)}</b>${u.passwordChangePending?` <span class="pending">En attente</span>`:""}</td><td>${esc(u.email)}</td><td>${esc(u.phone||"")}</td><td>${fmt(u.createdAt)}</td><td>${presence(u)}</td></tr>`).join("")||"<tr><td colspan=5>Aucun inscrit.</td></tr>"}</tbody></table></div></div>`;
      else if(i==="resets")content+=`<div class="panel"><h3>Nouveaux mots de passe à confirmer</h3><p>Le compte de ces membres est en attente : ils ne peuvent pas se connecter tant que vous n’avez pas confirmé. Refuser rétablit leur ancien mot de passe.</p>${state.pwRequests.map(r=>`<div class="log"><strong>${esc(r.firstName+" "+r.lastName)} · ${esc(r.email)}</strong><span>${esc(r.phone||"")} · demandé ${r.requestedAt?fmt(r.requestedAt):""}</span><div class="pw-actions"><button class="btn green small" onclick="pwDecision(${r.id},'confirm')">Confirmer</button><button class="btn light small" onclick="pwDecision(${r.id},'reject')">Refuser</button></div></div>`).join("")||"<p>Aucune demande en attente.</p>"}</div>`;
      else content+=`<div class="metrics"><div class="metric"><strong>${state.users.length}</strong><span>profils inscrits</span></div><div class="metric"><strong>${online.length}</strong><span>en ligne maintenant</span></div><div class="metric"><strong>${n}</strong><span>mots de passe à confirmer</span></div></div><div class="panel"><h3>Connectés en ce moment</h3>${online.map(u=>`<div class="row"><span class="dot on"></span><b>${esc(u.firstName+" "+u.lastName)}</b> <span class="muted">${esc(u.email)}</span></div>`).join("")||"<p>Personne n’est en ligne.</p>"}</div>`;

const PL={mine:{requests:[],responses:[]},open:[],showOpen:false,chatId:null,chatTimer:null,admin:[],cfg:{passLink:""}};
const busyUi=()=>{const a=document.activeElement;return (a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||[...document.querySelectorAll("video")].some(v=>!v.paused&&!v.ended)||document.getElementById("plModal")};
const VT={"mp4":"video/mp4","mov":"video/quicktime","webm":"video/webm","m4v":"video/mp4"};
function readUrl(blob){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>ko(Error("Fichier illisible."));r.readAsDataURL(blob)})}
function vidMeta(file){return new Promise((ok,ko)=>{const v=document.createElement("video");v.preload="metadata";v.onloadedmetadata=()=>{ok(v.duration);URL.revokeObjectURL(v.src)};v.onerror=()=>ko(Error("Vidéo illisible. Utilisez un fichier MP4, MOV ou WebM."));v.src=URL.createObjectURL(file)})}
function shrinkVideo(file){return new Promise((ok,ko)=>{const fail=()=>ko(Error("Vidéo trop lourde (18 Mo max). Filmez en qualité standard (720p)."));const v=document.createElement("video");v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(file);v.onerror=fail;v.onloadedmetadata=()=>{const cap=v.captureStream||v.mozCaptureStream;const mt=["video/webm;codecs=vp8,opus","video/webm"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));if(!cap||!mt)return fail();const rec=new MediaRecorder(cap.call(v),{mimeType:mt,videoBitsPerSecond:1500000,audioBitsPerSecond:64000});const ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);rec.onstop=()=>ok(new Blob(ch,{type:"video/webm"}));v.onended=()=>rec.stop();rec.start();v.play().catch(fail)}})}
async function prepVideo(file){
  if(!file)throw Error("Ajoutez une vidéo de 15 secondes maximum.");
  const d=await vidMeta(file);if(d>15.6)throw Error("La vidéo doit durer 15 secondes au maximum.");
  let blob=file;const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(!/^video\/(mp4|webm|quicktime)$/.test(file.type))blob=file.slice(0,file.size,VT[ext]||"video/mp4");
  if(blob.size>16*1024*1024){toast("Compression de la vidéo…",true);blob=await shrinkVideo(file)}
  if(blob.size>17*1024*1024)throw Error("Vidéo trop lourde (18 Mo max). Filmez en qualité standard (720p).");
  return readUrl(blob)
}
const STAT={pending:"En attente de l’équipe",open:"Diffusée",chosen:"Personne choisie",closed:"Clôturée"};
function planPanel(){return `<div class="panel"><h3>Plan de ce soir</h3><div id="planRoot"><p class="muted">Chargement…</p></div></div>`}

async function planLoad(){
  if(state.view==="chat")return chatLoad();
  clearInterval(PL.chatTimer);
  try{
    const [mine,open]=await Promise.all([api("/api/plans/mine"),api("/api/plans/open")]);
    PL.mine=mine;PL.open=open;planDraw()
  }catch(x){const r=document.getElementById("planRoot");if(r)r.innerHTML=`<div class="alert">${esc(x.message)}</div>`}
  clearInterval(PL.chatTimer);PL.chatTimer=setInterval(()=>{if(state.view==="plan"&&!busyUi())planLoad()},15000)
}
function planDraw(){
  const r=document.getElementById("planRoot");if(!r)return;
  const m=PL.mine,u=state.user,active=m.requests.some(q=>q.status!=="closed");
  let h="";
  const n=PL.open.filter(o=>!o.interested).length;
  h+=`<button class="btn red" data-progress-ignore="true" onclick="PL.showOpen=!PL.showOpen;planDraw()">${PL.showOpen?"Masquer":"Voir la tâche d’aujourd’hui"}${n?` (${n})`:""}</button>`;
  if(PL.showOpen)h+=`<div style="margin-top:12px">${PL.open.map(o=>`<div class="row"><b>${esc(o.pseudo)}</b><p>${esc(o.label)}. Si vous êtes intéressé(e), appuyez sur « Disponible ».</p>${o.note?`<p class="muted">${esc(o.note)}</p>`:""}${o.interested?`<span class="pill">Réponse envoyée</span>`:`<button class="btn green small" data-progress-ignore="true" onclick="interestModal(${o.id})">Disponible</button>`}</div>`).join("")||"<p>Aucune demande pour vous aujourd’hui.</p>"}</div>`;
  if(m.responses.length)h+=`<h4 style="margin:22px 0 4px">Mes réponses</h4>`+m.responses.map(x=>`<div class="row"><b>${esc(x.pseudo)}</b> <span class="muted">${x.status==="chosen"?"Vous avez été choisi(e)":x.status==="rejected"?"Non retenu":x.status==="presented"?"Présenté(e) au demandeur":"En attente de l’équipe"}</span>${x.status==="chosen"&&x.chatActive?` <button class="btn primary small" data-progress-ignore="true" onclick="openChat(${x.planId})">Discuter</button>`:""}</div>`).join("");
  h+=`<h4 style="margin:22px 0 4px">Mes demandes</h4>`;
  h+=m.requests.map(q=>{
    let b=`<div class="row"><span class="pill">${STAT[q.status]||q.status}</span> <b>${esc(q.pseudo)}</b>`;
    if(q.status==="pending")b+=`<p>Votre demande est en cours de validation.</p>`;
    if(q.expired)b+=`<div class="alert">Le délai de 10 minutes est dépassé. Choisissez une autre personne.</div>`;if(q.status==="open"&&!q.interests.length)b+=`<p>En attente d’une autre personne…</p>`;
    if(q.status==="open"&&q.interests.length)b+=`<p>Personnes disponibles, choisissez :</p><div style="display:flex;gap:10px;flex-wrap:wrap">${q.interests.map(i=>`<div style="text-align:center"><img src="${i.photoUrl}" alt="" style="width:130px;height:160px;object-fit:cover;border-radius:12px;display:block"><button class="btn primary small" style="margin-top:6px" data-progress-ignore="true" onclick="choosePerson(${q.id},${i.id})">Choisir</button></div>`).join("")}</div>`;
    if(q.status==="chosen"){
      b+=q.interests.map(i=>`<img src="${i.photoUrl}" alt="" style="width:130px;height:160px;object-fit:cover;border-radius:12px;display:block;margin:8px 0">`).join("");
      if(q.chatActive)b+=`<button class="btn primary" data-progress-ignore="true" onclick="openChat(${q.id})">Discuter</button>`;
      else if(q.passLink)b+=`<div class="alert success-alert"><b>Patience.</b> L’administrateur vous mettra en contact avec cette personne.</div><button class="btn red" data-progress-ignore="true" onclick="passGo(${q.id},'${esc(q.passLink).replace(/'/g,"%27")}')">Payer maintenant pour être en contact</button>`;
      else b+=`<div class="alert success-alert"><b>Patience.</b> L’administrateur vous mettra en contact avec cette personne.</div><button class="btn primary" data-progress-ignore="true" onclick="openChat(${q.id})">Discuter</button>`;
      if(!q.chatActive&&q.passClicked&&q.passLink)b+=`<p class="muted">Après le paiement, vous arrivez directement sur la page de confirmation. Vous avez 10 minutes.</p>`
    }
    return b+`</div>`}).join("")||"<p class=\"muted\">Aucune demande aujourd’hui.</p>";
  if(!active){
    h+=`<div class="mail-box" style="margin-top:14px"><h4>Je veux un plan ce soir</h4><p>Je suis ${u.gender==="femme"?"une femme":u.gender==="homme"?"un homme":"une personne"}. Ajoutez une vidéo de 15 secondes maximum et votre numéro WhatsApp.</p><form id="planForm"><div class="mail-fields">${u.gender==="homme"||u.gender==="femme"?"":`<div class="field"><label>Je cherche</label><select name="target"><option value="femme">Une femme</option><option value="homme">Un homme</option></select></div>`}<div class="field"><label>Numéro WhatsApp</label><input name="whatsapp" inputmode="tel" required value="${esc(u.phone||"")}"></div><div class="field full"><label>Vidéo (15 s max)</label><input type="file" name="video" accept="video/*" required></div><div class="field full"><label>Message (facultatif)</label><input name="note" maxlength="300"></div></div><button class="btn primary" style="margin-top:12px" data-progress-ignore="true">Envoyer ma demande</button></form></div>`}
  r.innerHTML=h;
  document.getElementById("planForm")?.addEventListener("submit",submitPlan)
}
async function submitPlan(e){
  e.preventDefault();const f=e.target,b=f.querySelector("button");b.disabled=true;
  try{const fd=new FormData(f);const video=await prepVideo(fd.get("video"));
    await api("/api/plans",{method:"POST",body:JSON.stringify({whatsapp:fd.get("whatsapp"),note:fd.get("note"),target:fd.get("target"),video})});
    toast("Demande envoyée à l’équipe.",true);planLoad()}
  catch(x){toast(x.message);b.disabled=false}
}
function interestModal(id){
  const d=document.createElement("div");d.id="plModal";d.className="modal";
  d.innerHTML=`<div class="modal-box"><h3>Je suis disponible</h3><p>Envoyez une photo et une vidéo (15 s max).</p><form id="intForm" style="text-align:left"><div class="field"><label>Numéro WhatsApp</label><input name="whatsapp" inputmode="tel" required value="${esc(state.user.phone||"")}"></div><div class="field"><label>Photo</label><input type="file" name="photo" accept="image/*" required></div><div class="field"><label>Vidéo (15 s max)</label><input type="file" name="video" accept="video/*" required></div><button class="btn primary" data-progress-ignore="true">Envoyer</button><button type="button" class="btn light" data-progress-ignore="true" onclick="document.getElementById('plModal').remove()">Annuler</button></form></div>`;
  document.body.appendChild(d);
  document.getElementById("intForm").addEventListener("submit",async e=>{
    e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;
    try{const fd=new FormData(e.target);const photo=await fileData(fd.get("photo"));const video=await prepVideo(fd.get("video"));
      await api(`/api/plans/${id}/interest`,{method:"POST",body:JSON.stringify({whatsapp:fd.get("whatsapp"),photo,video})});
      d.remove();toast("Réponse envoyée à l’équipe.",true);planLoad()}
    catch(x){toast(x.message);b.disabled=false}})
}
async function choosePerson(pid,iid){try{await api(`/api/plans/${pid}/choose`,{method:"POST",body:JSON.stringify({interestId:iid})});planLoad()}catch(x){toast(x.message)}}
async function passGo(pid,link){window.open(link,"_blank","noopener");try{await api(`/api/plans/${pid}/pass`,{method:"POST"})}catch(_x){}planLoad()}
function openChat(pid){PL.chatId=pid;state.view="chat";userPage()}

/* ----- Discussion (page dédiée) ----- */
async function chatLoad(){
  const r=document.getElementById("planRoot");if(!r)return;
  clearInterval(PL.chatTimer);
  const draw=async(first)=>{
    try{
      const c=await api(`/api/plans/${PL.chatId}/chat`);
      const keep=document.getElementById("chatInput")?.value||"";
      if(c.closed)r.innerHTML=`<p>Cette discussion est terminée.</p><button class="btn light" onclick="state.view='plan';userPage()">Retour</button>`;
      else if(c.locked)r.innerHTML=`<div class="alert success-alert"><b>Discussion en attente.</b> Elle s’ouvrira dès que l’administrateur aura confirmé.</div><button class="btn light" data-progress-ignore="true" onclick="state.view='plan';userPage()">Retour</button>`;
      else{
        const box=document.getElementById("chatBox"),stick=!box||box.scrollTop+box.clientHeight>=box.scrollHeight-40;
        r.innerHTML=`<p class="muted">Discussion avec ${esc(c.with)} · effacée chaque nuit à 00h. L’équipe peut la consulter pour votre sécurité.</p><div id="chatBox" style="max-height:340px;overflow:auto;padding:6px 0">${c.messages.map(m=>`<div style="display:flex;justify-content:${m.mine?"flex-end":"flex-start"};margin:6px 0"><div style="max-width:78%;padding:9px 12px;border-radius:14px;background:${m.mine?"#dfebff":"#fff"};border:1px solid #dce5f0">${esc(m.body)}<br><small class="muted">${fmt(m.at)}</small></div></div>`).join("")||"<p class=\"muted\">Dites bonjour 👋</p>"}</div><form id="chatForm" style="display:flex;gap:8px;margin-top:10px"><input id="chatInput" maxlength="1000" autocomplete="off" placeholder="Votre message…" required><button class="btn primary" data-progress-ignore="true">Envoyer</button></form><button class="btn light small" style="margin-top:12px" data-progress-ignore="true" onclick="state.view='plan';userPage()">Retour</button>`;
        const ci=document.getElementById("chatInput");ci.value=keep;if(keep)ci.focus();
        const nb=document.getElementById("chatBox");if(stick)nb.scrollTop=nb.scrollHeight;
        document.getElementById("chatForm").addEventListener("submit",async e=>{e.preventDefault();const v=ci.value.trim();if(!v)return;ci.value="";try{await api(`/api/plans/${PL.chatId}/chat`,{method:"POST",body:JSON.stringify({body:v})});draw()}catch(x){toast(x.message);ci.value=v}})
      }
    }catch(x){r.innerHTML=`<div class="alert">${esc(x.message)}</div>`}
  };
  await draw(true);
  PL.chatTimer=setInterval(()=>{if(state.view!=="chat")return clearInterval(PL.chatTimer);const a=document.activeElement;if(a&&a.id==="chatInput"&&a.value)return;draw()},4000)
}

/* ----- Administrateur ----- */
function adminPlanPanel(){return `<div class="panel"><h3>${state.view==="chats"?"Discussions de mes clients":"Plan de mes clients"}</h3><div id="admRoot"><p class="muted">Chargement…</p></div></div>`}
function setBadge(){
  const waiting=PL.admin.filter(p=>p.status==="pending"||p.chatRequested||(p.status==="open"&&p.interests.some(i=>i.status==="new"))).length;
  const b=document.getElementById("navPlans");if(b)b.textContent="Plan de mes clients"+(waiting?` (${waiting})`:"")
}
async function adminPlansLoad(silent){
  if(silent&&busyUi())return;
  try{
    const [list,cfg]=await Promise.all([api("/api/admin/plans"),api("/api/admin/settings")]);
    PL.admin=list;PL.cfg=cfg;setBadge();if(state.view==="plans"||state.view==="chats")adminDraw()
  }catch(x){const r=document.getElementById("admRoot");if(r)r.innerHTML=`<div class="alert">${esc(x.message)}</div>`}
}
const hhmm=t=>new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
const vid=(u,del,at)=>u?`<video controls playsinline preload="none" src="${u}" style="width:100%;max-width:320px;max-height:360px;border-radius:12px;background:#000;display:block;margin:8px 0"></video><small class="muted">${at?`Sera supprimée à ${hhmm(at)}`:"Supprimée 10 min après la première lecture"}</small>`:del?`<p class="muted">Vidéo supprimée</p>`:"";
function adminDraw(){
  const r=document.getElementById("admRoot");if(!r)return;
  if(state.view==="chats"){
    r.innerHTML=`<p>Les discussions s’effacent chez les membres à 00h ; elles restent ici et dans l’export.</p><a class="btn green small" href="/api/admin/export.csv">Exporter vers Excel (CSV)</a>
    <div class="mail-box"><h4>Lien du bouton « Payer maintenant pour être en contact »</h4><form id="cfgForm"><input name="passLink" type="url" placeholder="https://…" value="${esc(PL.cfg.passLink)}"><button class="btn primary small" style="margin-top:10px" data-progress-ignore="true">Enregistrer le lien</button></form></div>`+
    (PL.admin.filter(p=>p.messages.length||p.chatActive||p.chatRequested).map(p=>`<div class="row"><b>${esc(p.pseudo)}</b> · ${esc(p.requester)} <span class="muted">${p.chatActive?"ouverte":p.chatRequested?"activation demandée":"fermée"}</span>
      ${p.status==="chosen"&&!p.chatActive?`<button class="btn green small" data-progress-ignore="true" onclick="admAct(${p.id},'activate-chat')">Activer la discussion</button>`:""}${p.chatActive?`<button class="btn light small" data-progress-ignore="true" onclick="admAct(${p.id},'close-chat')">Fermer</button>`:""}
      <div style="margin-top:8px">${p.messages.map(m=>`<div class="log"><strong>${esc(m.author)}</strong><span>${fmt(m.at)}</span><p style="margin:2px 0 0">${esc(m.body)}</p></div>`).join("")||"<p class=\"muted\">Aucun message aujourd’hui.</p>"}</div></div>`).join("")||"<p class=\"muted\">Aucune discussion.</p>");
    document.getElementById("cfgForm").addEventListener("submit",async e=>{e.preventDefault();try{PL.cfg=await api("/api/admin/settings",{method:"POST",body:JSON.stringify({passLink:new FormData(e.target).get("passLink")})});toast("Lien enregistré.",true)}catch(x){toast(x.message)}});
    return}
  r.innerHTML=PL.admin.map(p=>`<div class="row"><span class="pill">${STAT[p.status]}</span> <b>${esc(p.requester)}</b> <span class="muted">· pseudo ${esc(p.pseudo)} · WhatsApp ${esc(p.whatsapp)} · ${fmt(p.createdAt)}</span><p>${esc(p.label)}${p.note?` — ${esc(p.note)}`:""}</p>${vid(p.videoUrl,p.videoDeleted,p.videoDeleteAt)}
    ${p.status==="pending"?`<button class="btn primary small" data-progress-ignore="true" onclick="admAct(${p.id},'open')">Qui est intéressé</button>`:""}
    ${p.interests.map(i=>`<div class="log" style="border-left:3px solid #ed7898;padding-left:10px"><strong>${esc(i.name)} · WhatsApp ${esc(i.whatsapp)}</strong><span>${i.status==="new"?"Nouvelle réponse":i.status==="presented"?"Présenté(e) au demandeur":i.status==="chosen"?"Choisi(e)":i.status==="expired"?"Délai dépassé":"Non retenu(e)"}</span><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start"><img src="${i.photoUrl}" alt="" style="width:120px;height:150px;object-fit:cover;border-radius:10px;margin-top:8px">${vid(i.videoUrl,i.videoDeleted,i.videoDeleteAt)}</div>${i.status==="new"&&p.status==="open"?`<button class="btn green small" data-progress-ignore="true" onclick="admPresent(${p.id},${i.id})">Mise en contact avec le demandeur</button>`:""}</div>`).join("")}
    ${p.chatRequested&&!p.chatActive?`<div class="alert">Le demandeur demande l’activation de la discussion.${p.passClickedAt?` Lien de paiement ouvert à ${fmt(p.passClickedAt)} : à confirmer avant ${new Date(new Date(p.passClickedAt).getTime()+p.graceMs).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})} (10 min).`:""}</div><button class="btn green small" data-progress-ignore="true" onclick="admAct(${p.id},'activate-chat')">Activer la discussion</button>`:""}
    ${p.status!=="closed"?`<button class="btn light small" style="margin-top:6px" data-progress-ignore="true" onclick="if(confirm('Clôturer cette demande ?'))admAct(${p.id},'close')">Clôturer</button>`:""}</div>`).join("")||"<p class=\"muted\">Aucune demande.</p>"
}
async function admAct(id,act){try{await api(`/api/admin/plans/${id}/${act}`,{method:"POST"});await adminPlansLoad()}catch(x){toast(x.message)}}
async function admPresent(pid,iid){try{await api(`/api/admin/plans/${pid}/interests/${iid}/present`,{method:"POST"});toast("Photo envoyée au demandeur.",true);await adminPlansLoad()}catch(x){toast(x.message)}}
setInterval(()=>{if(state.role==="admin"&&location.hash==="#admin"&&state.view!=="plans"&&state.view!=="chats")api("/api/admin/plans").then(l=>{PL.admin=l;setBadge()}).catch(()=>{})},20000);
setInterval(()=>{if(state.role==="admin"&&(state.view==="plans"||state.view==="chats"))adminPlansLoad(true)},15000);

  </script>
</body>
