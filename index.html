<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24172e">
  <meta name="description" content="Cœur & Connexions, une rencontre privée, humaine et accompagnée.">
  <title>Cœur & Connexions</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
    :root{--ink:#25172d;--plum:#4b2857;--deep:#24172e;--rose:#ed7898;--rose2:#ffd7e2;--cream:#fbf7f4;--muted:#7c6d82;--line:#ebdfe8;--green:#2a9d78;--blue:#347fe9;--shadow:0 24px 70px #3619411c}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 "DM Sans",system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a{cursor:pointer}a{text-decoration:none;color:inherit}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.hidden{display:none!important}
    .page{min-height:100vh;background:radial-gradient(circle at 10% 0,#ffe6ee 0,transparent 28%),radial-gradient(circle at 100% 15%,#e9e0fa 0,transparent 28%),var(--cream)}.nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0}.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--deep);color:#fff;font-size:22px}.actions{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:12px;padding:12px 17px;display:inline-flex;justify-content:center;align-items:center;gap:8px;font-weight:700;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 25px #391d471e}.primary{background:var(--deep);color:#fff}.blue{background:var(--blue);color:#fff}.pink{background:var(--rose2);color:var(--plum)}.light{background:#fff;border:1px solid var(--line);color:var(--plum)}.green{background:var(--green);color:#fff}.small{padding:8px 11px;font-size:12px;border-radius:9px}
    .hero{min-height:570px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:55px;padding:50px 0 85px}.kicker{display:inline-flex;gap:8px;align-items:center;color:var(--rose);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}.kicker:before{content:"";width:24px;height:2px;background:currentColor}.hero h1{font:500 clamp(48px,7vw,84px)/.98 "Playfair Display",serif;color:var(--plum);letter-spacing:-.06em;margin:18px 0}.hero h1 em{font-style:normal;color:var(--rose)}.lead{max-width:510px;color:var(--muted);font-size:18px}.hero-art{height:440px;position:relative}.art{position:absolute;inset:36px 45px 20px 65px;border-radius:44% 44% 22px 22px;background:linear-gradient(145deg,#945678,#f1a0aa 60%,#f7d0b6);box-shadow:var(--shadow);transform:rotate(3deg)}.art:before{content:"";position:absolute;width:175px;height:220px;left:50%;top:52px;transform:translateX(-50%);border-radius:48%;background:linear-gradient(140deg,#382138 0 34%,#cf7c82 35% 100%);box-shadow:0 173px 0 80px #f1c4b7}.float{position:absolute;background:#fff;padding:13px 15px;border-radius:16px;box-shadow:var(--shadow);z-index:2}.float strong{display:block;color:var(--plum);font-size:13px}.float small{color:var(--muted);font-size:11px}.f1{right:0;top:20px;transform:rotate(5deg)}.f2{left:0;bottom:24px;transform:rotate(-6deg)}.footer{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:12px}
    .auth{min-height:100vh;display:grid;grid-template-columns:.82fr 1.18fr}.visual{padding:32px 8vw;background:var(--deep);color:#fff;display:flex;flex-direction:column;justify-content:space-between}.visual h1{font:500 clamp(38px,5vw,64px)/1 "Playfair Display",serif;margin:20px 0}.visual p{color:#dbcadd;max-width:370px}.points{display:grid;gap:12px;color:#f9e8ee;font-size:13px}.card{width:min(100%,620px);margin:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--shadow)}.auth-main{padding:30px 7vw;display:grid;place-items:center;background:linear-gradient(145deg,#edf3fa,#fafcff)}.card h2{font:500 clamp(30px,4vw,44px)/1.05 "Playfair Display",serif;color:var(--plum);margin:12px 0 8px}.card>p{color:var(--muted);margin-top:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.field{display:flex;flex-direction:column;gap:6px;margin-top:15px}.field label{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--plum)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--rose);box-shadow:0 0 0 4px #ed78981d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 13px}.full{grid-column:1/-1}.check{display:flex;gap:9px;margin-top:16px;color:var(--muted);font-size:12px}.check input{width:auto;accent-color:var(--rose)}.form-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}.alert{padding:11px 13px;border-radius:10px;background:#fff0f3;color:#a33e5e;margin-top:14px;font-size:13px}.success-alert{background:#e4f8ef;color:#277458}
    .shell{min-height:100vh;background:radial-gradient(circle at 95% 0,#e1ebff 0,transparent 26%),#f4f7fb}.bar{background:#0c111b;color:#fff}.bar-in{display:flex;justify-content:space-between;align-items:center;padding:13px 0}.bar .mark{background:#3c74dd}.who{display:flex;align-items:center;gap:10px;font-size:13px}.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#26395e;color:#a8c8ff;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.work{padding:40px 0}.layout{display:grid;grid-template-columns:210px 1fr;gap:26px}.side{align-self:start;position:sticky;top:20px}.side b{display:block;color:#8492a8;font-size:10px;text-transform:uppercase;letter-spacing:.15em;margin:0 0 9px}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#71809a;border-radius:10px;padding:10px 12px;font-weight:700;margin-bottom:3px}.side button.active,.side button:hover{background:#dfebff;color:#225fbe}.welcome{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.welcome h2{font:500 clamp(30px,4vw,48px)/1.05 "Playfair Display",serif;color:#172b4d;margin:8px 0}.welcome p{color:#74839a;margin:0}.pill{display:inline-flex;padding:6px 10px;border-radius:99px;background:#dff8ee;color:#178368;font-size:11px;font-weight:800;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:16px}.metric,.panel{border:0;background:#f3f7fc;box-shadow:10px 12px 28px #cbd5e224,-8px -8px 22px #fff;border-radius:18px;padding:20px}.metric strong{display:block;font:600 31px "Playfair Display",serif;color:#1d3761}.metric span{color:#74839a;font-size:12px}.panel h3{color:#172b4d;margin:0}.panel>p{color:#74839a;font-size:13px}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.row{padding:14px 0;border-bottom:1px solid #dee7f1}.row:last-child{border-bottom:0}.row time{font-size:10px;color:var(--rose);font-weight:800}.row h4{margin:3px 0;color:#29466e}.row p{margin:0;color:#74839a;font-size:13px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #dce5f0;font-size:12px}.table th{font-size:10px;color:#7c8ba4;text-transform:uppercase}.pending{color:#ae7520}.active-txt{color:#277458}.mail-box{background:#eaf2fb;border-radius:15px;padding:16px;margin-top:15px}.mail-box h4{color:#244f91;margin:0 0 5px}.mail-box p{color:#71819a;font-size:12px;margin:0 0 14px}.mail-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mail-fields .field{margin:0}.mail-fields .full{grid-column:1/-1}.muted{color:#7c8ba4;font-size:12px}.log{padding:11px 0;border-bottom:1px solid #dce5f0;font-size:12px}.log strong{display:block;color:#29466e}.log span{color:#7b8ba2}.sent{color:#178368;font-weight:800}.failed{color:#b23c5d;font-weight:800}.draft{color:#a16c12;font-weight:800}.progress-overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(2,5,8,.94);backdrop-filter:blur(5px);z-index:50}.progress-card{width:min(560px,100%);padding:30px 24px;background:transparent;text-align:center}.progress-card strong{display:block;color:#fff;font:700 18px/1.2 "DM Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase}.progress-card p{margin:10px 0 22px;color:#aeb7c1;font-size:13px}.progress-track{height:18px;border:2px solid #fff;border-radius:2px;background:#fff;overflow:hidden;box-shadow:0 0 0 1px #ffffff22,0 8px 28px #000}.progress-value{height:100%;width:0;border-radius:0;background:#e5093f;transition:width .16s linear}.progress-number{display:block;margin-top:12px;color:#fff;font-size:14px;font-weight:700;letter-spacing:.08em}.toast{position:fixed;right:20px;bottom:20px;background:#24172e;color:#fff;border-radius:11px;padding:12px 16px;z-index:60;box-shadow:var(--shadow)}@media(max-width:850px){.hero{grid-template-columns:1fr;padding-top:25px}.hero-art{max-width:550px;width:100%;margin:auto}.auth{grid-template-columns:1fr}.visual{display:none}.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:4px;position:static}.side b{display:none}.side button{white-space:nowrap;width:auto}.split{grid-template-columns:1fr}}@media(max-width:590px){.wrap{width:calc(100% - 24px)}.nav{flex-wrap:wrap;gap:12px}.actions{width:100%}.actions .btn{flex:1;padding:10px 8px;font-size:12px}.hero h1{font-size:54px}.hero-art{height:350px}.art{inset:28px 28px 18px 48px}.grid,.mail-fields{grid-template-columns:1fr}.full,.mail-fields .full{grid-column:auto}.card{padding:22px}.form-foot,.welcome{align-items:flex-start;flex-direction:column}.form-foot .btn{width:100%}.metrics{grid-template-columns:1fr}.footer{display:block}.footer span{display:block;margin-top:5px}}
  </style>
</head>
<body>
  <div id="progressOverlay" class="progress-overlay hidden" aria-live="polite">
    <div class="progress-card">
      <strong id="progressTitle">Ouverture en cours</strong>
      <p id="progressMessage">Préparation de votre espace…</p>
      <div class="progress-track"><div id="progressValue" class="progress-value"></div></div>
      <span id="progressNumber" class="progress-number">0%</span>
    </div>
  </div>
  <div id="root"></div><div id="toast" class="toast hidden"></div>
  <script>
    const root=document.getElementById("root"),toastEl=document.getElementById("toast");
    const state={user:null,role:null,view:"dashboard",users:[],messages:[],announcements:[],logs:[],mail:null,pendingEmail:"",pendingResetEmail:"",resetDelivery:""};
    const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const initials=u=>((u?.firstName||"C")[0]+(u?.lastName||"C")[0]).toUpperCase();
    const fmt=v=>new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(v));
    async function api(url,options={}){const r=await fetch(url,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options});let x={};try{x=await r.json()}catch(_e){}if(!r.ok)throw Error(x.error||"Une erreur est survenue.");return x}
    function toast(msg,good=false){toastEl.textContent=msg;toastEl.style.background=good?"#277458":"#24172e";toastEl.classList.remove("hidden");clearTimeout(window._toast);window._toast=setTimeout(()=>toastEl.classList.add("hidden"),4000)}
    function go(route){location.hash=route;render()}
    function runWithProgress(target){
      if(window.progressBusy)return;
      window.progressBusy=true;
      const overlay=document.getElementById("progressOverlay"),valueEl=document.getElementById("progressValue"),numberEl=document.getElementById("progressNumber"),titleEl=document.getElementById("progressTitle"),messageEl=document.getElementById("progressMessage");
      const label=(target.textContent||"Ouverture").replace(/\s+/g," ").trim().slice(0,48)||"Ouverture";
      titleEl.textContent=label;
      messageEl.textContent="Préparation de votre espace…";
      valueEl.style.width="0%";numberEl.textContent="0%";overlay.classList.remove("hidden");
      const steps=["Vérification de l’action…","Chargement de la page…","Préparation de votre espace…","Presque terminé…"];
      let progress=0;
      const timer=setInterval(()=>{
        progress=Math.min(100,progress+8+Math.ceil(Math.random()*9));
        valueEl.style.width=`${progress}%`;numberEl.textContent=`${progress}%`;
        messageEl.textContent=steps[Math.min(3,Math.floor(progress/26))];
        if(progress>=100){
          clearInterval(timer);
          setTimeout(()=>{
            overlay.classList.add("hidden");
            window.progressBypass=true;
            target.click();
            window.progressBypass=false;
            window.progressBusy=false;
          },180);
        }
      },90);
    }
    function authFrame(content,title="Un espace privé pour les vraies intentions."){return `<div class="auth"><aside class="visual"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><div><span class="kicker">Un espace à part</span><h1>${title}</h1><p>Un accompagnement discret pour avancer avec plus de confiance, moins de bruit et de vraies intentions.</p></div><div class="points"><div>♡ Confidentialité au centre</div><div>✦ Profils examinés avec attention</div><div>↗ Vous gardez le choix à chaque étape</div></div></aside><main class="auth-main">${content}</main></div>`}
    function login(){root.innerHTML=authFrame(`<div class="card"><div class="top"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><a class="muted" href="#" onclick="go('')">Accueil</a></div><span class="kicker">Espace confidentiel</span><h2>Ravi de vous revoir.</h2><p>Retrouvez vos échanges et votre parcours privé.</p><form id="login"><div class="field"><label>ADRESSE EMAIL</label><input name="email" type="email" required></div><div class="field"><label>MOT DE PASSE</label><input name="password" type="password" required></div><div id="error"></div><div class="form-foot"><span><a class="muted" href="#" onclick="go('inscription')">Créer un compte</a><br><a class="muted" href="#" onclick="go('mot-de-passe-oublie')">Mot de passe oublié ?</a></span><button class="btn primary">Se connecter →</button></div></form></div>`);document.getElementById("login").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const r=await api("/api/auth/login",{method:"POST",body:JSON.stringify(Object.fromEntries(f))});if(r.requiresCode){state.pendingEmail=f.get("email");return codePage()}state.user=r.user;state.role=r.role;go(r.role==="admin"?"admin":"espace")}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function codePage(){root.innerHTML=authFrame(`<div class="card"><div class="top"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><a class="muted" href="#" onclick="go('connexion')">Retour</a></div><span class="kicker">Dernière vérification</span><h2>Votre code secret.</h2><p>Le code à 6 chiffres sera envoyé par le mode choisi par l’administrateur.</p><form id="code"><div class="field"><label>CODE À 6 CHIFFRES</label><input name="code" inputmode="numeric" maxlength="6" pattern="\\d{6}" required></div><div id="error"></div><button class="btn primary" style="width:100%;margin-top:18px">Ouvrir mon espace →</button></form></div>`,"La confiance commence par un espace sécurisé.");document.getElementById("code").onsubmit=async e=>{e.preventDefault();try{const r=await api("/api/auth/verify-code",{method:"POST",body:JSON.stringify({code:new FormData(e.target).get("code")})});state.user=r.user;state.role="user";go("espace")}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function forgotPassword(){root.innerHTML=authFrame(`<div class="card"><div class="top"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><a class="muted" href="#" onclick="go('connexion')">Retour</a></div><span class="kicker">Accès à votre espace</span><h2>Mot de passe oublié ?</h2><p>Saisissez votre email. Si le compte est confirmé, un code de réinitialisation sera envoyé à cette adresse.</p><form id="forgotPassword"><div class="field"><label>ADRESSE EMAIL</label><input name="email" type="email" required></div><div id="error"></div><button class="btn primary" style="width:100%;margin-top:18px">Envoyer le code →</button></form></div>`,"Retrouvez votre espace en toute sécurité.");document.getElementById("forgotPassword").onsubmit=async e=>{e.preventDefault();const email=String(new FormData(e.target).get("email")||"").trim().toLowerCase();try{const r=await api("/api/auth/forgot-password",{method:"POST",body:JSON.stringify({email})});state.pendingResetEmail=email;state.resetDelivery=r.delivery||"";toast(r.delivery==="manual"?"La demande attend l’envoi manuel de l’administrateur.":"Si le compte existe, le code a été envoyé.",true);resetCodePage()}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function resetCodePage(){const note=state.resetDelivery==="manual"?"L’administrateur doit d’abord envoyer le brouillon Gmail.":"Le code est valable 15 minutes et ne peut être utilisé qu’une seule fois.";root.innerHTML=authFrame(`<div class="card"><div class="top"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><a class="muted" href="#" onclick="go('mot-de-passe-oublie')">Retour</a></div><span class="kicker">Vérification</span><h2>Votre code de réinitialisation.</h2><p>${note}</p><form id="resetCode"><div class="field"><label>CODE À 6 CHIFFRES</label><input name="code" inputmode="numeric" maxlength="6" pattern="\\d{6}" required></div><div id="error"></div><button class="btn primary" style="width:100%;margin-top:18px">Vérifier le code →</button></form></div>`,"Un nouveau départ commence ici.");document.getElementById("resetCode").onsubmit=async e=>{e.preventDefault();try{await api("/api/auth/verify-reset-code",{method:"POST",body:JSON.stringify({email:state.pendingResetEmail,code:new FormData(e.target).get("code")})});newPasswordPage()}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function newPasswordPage(){root.innerHTML=authFrame(`<div class="card"><div class="top"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><span class="muted">Dernière étape</span></div><span class="kicker">Sécurité du compte</span><h2>Choisissez un nouveau mot de passe.</h2><p>Utilisez au moins 8 caractères. Il remplacera définitivement l’ancien.</p><form id="newPassword"><div class="field"><label>NOUVEAU MOT DE PASSE</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>CONFIRMATION</label><input name="passwordConfirmation" type="password" minlength="8" required></div><div id="error"></div><button class="btn primary" style="width:100%;margin-top:18px">Enregistrer le nouveau mot de passe →</button></form></div>`,"Votre compte reste protégé à chaque étape.");document.getElementById("newPassword").onsubmit=async e=>{e.preventDefault();try{const r=await api("/api/auth/reset-password",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});state.user=r.user;state.role="user";toast("Votre mot de passe a été modifié.",true);go("espace")}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function register(){root.innerHTML=authFrame(`<div class="card"><div class="top"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><a class="muted" href="#" onclick="go('')">Retour</a></div><span class="kicker">Votre histoire commence ici</span><h2>Créer votre espace.</h2><p>Une demande, une photo de profil, puis une validation humaine avant votre première connexion.</p><form id="register"><div class="grid"><div class="field"><label>PRÉNOM</label><input name="firstName" required></div><div class="field"><label>NOM</label><input name="lastName" required></div><div class="field"><label>TÉLÉPHONE</label><input name="phone" required></div><div class="field"><label>EMAIL</label><input name="email" type="email" required></div><div class="field"><label>MOT DE PASSE</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>CONFIRMATION</label><input name="passwordConfirmation" type="password" minlength="8" required></div><div class="field"><label>JE SUIS</label><select name="gender"><option value="femme">Une femme</option><option value="homme">Un homme</option><option value="autre">Autre</option></select></div><div class="field"><label>JE SOUHAITE RENCONTRER</label><select name="encounterType"><option value="femme">Une femme</option><option value="homme">Un homme</option><option value="tous">Tout profil compatible</option></select></div><div class="field full"><label>PHOTO DE PROFIL OBLIGATOIRE</label><input name="profilePhoto" type="file" accept="image/*" required><span class="muted">Elle sera utilisée comme votre photo de profil, comme sur Facebook.</span></div></div><label class="check"><input name="termsAccepted" type="checkbox" required><span>J’accepte les conditions de discrétion et de responsabilité.</span></label><div id="error"></div><div class="form-foot"><span class="muted">Validation manuelle par l’équipe.</span><button class="btn primary">Envoyer ma demande →</button></div></form></div>`,"Une belle histoire mérite un bon départ.");document.getElementById("register").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const photo=f.get("profilePhoto");if(!photo?.size)throw Error("Ajoutez une photo de profil pour continuer.");const x=Object.fromEntries(f);x.profilePhoto=await fileData(photo);x.termsAccepted=f.get("termsAccepted")==="on";await api("/api/auth/register",{method:"POST",body:JSON.stringify(x)});toast("Votre demande et votre photo de profil ont été envoyées.",true);go("connexion")}catch(x){document.getElementById("error").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}}
    function bar(){return `<div class="bar"><div class="wrap bar-in"><a class="brand" href="#" onclick="go('')"><span class="mark">♡</span>Cœur & Connexions</a><div class="who"><span class="avatar">${state.user?.profilePhoto?`<img src="${esc(state.user.profilePhoto)}" alt="Photo de profil">`:initials(state.user)}</span><span><b>${esc(state.user?.firstName||"Équipe")}</b><br><small>${state.role==="admin"?"Administration":"Espace privé"}</small></span><button class="btn light small" onclick="logout()">Quitter</button></div></div></div>`}
    function shell(items,content){return `<div class="shell">${bar()}<main class="wrap work"><div class="layout"><aside class="side"><b>${state.role==="admin"?"Pilotage":"Mon espace"}</b>${items}</aside><section>${content}</section></div></main></div>`}
    async function loadUser(){[state.user,state.announcements,state.messages]=await Promise.all([api("/api/me"),api("/api/announcements"),api("/api/messages")])}
    function userPage(){const items=`<button class="${state.view==="dashboard"?"active":""}" onclick="state.view='dashboard';userPage()">Vue d’ensemble</button><button class="${state.view==="messages"?"active":""}" onclick="state.view='messages';userPage()">Messages</button><button class="${state.view==="photos"?"active":""}" onclick="state.view='photos';userPage()">Mes photos</button>`;let content=`<div class="welcome"><div><span class="kicker">Espace privé</span><h2>Bonjour ${esc(state.user.firstName)}.</h2><p>Chaque étape reste entre vos mains.</p></div><span class="pill">Compte confirmé</span></div>`;if(state.view==="messages")content+=`<div class="panel"><h3>Échanges avec l’équipe</h3><div>${state.messages.map(m=>`<div class="row"><b>${m.senderRole==="admin"?"Équipe":"Vous"}</b><p>${esc(m.body)}</p><small class="muted">${fmt(m.createdAt)}</small></div>`).join("")||"<p>Aucun message pour le moment.</p>"}</div><form id="message" style="margin-top:14px"><textarea name="body" required placeholder="Écrivez votre message…"></textarea><button class="btn primary" style="margin-top:10px">Envoyer</button></form></div>`;else if(state.view==="photos")content+=`<div class="panel"><h3>Vos trois photos privées</h3><p>Ajoutez exactement trois photos pour permettre une mise en relation personnalisée.</p><input id="photos" type="file" accept="image/*" multiple><button class="btn primary" style="margin-top:14px" onclick="savePhotos()">Enregistrer mes photos</button></div>`;else content+=`<div class="metrics"><div class="metric"><strong>${state.announcements.length}</strong><span>annonces de l’équipe</span></div><div class="metric"><strong>${state.messages.length}</strong><span>messages privés</span></div><div class="metric"><strong>${state.user.photoCount}/3</strong><span>photos ajoutées</span></div></div><div class="split"><div class="panel"><h3>Les nouvelles de l’équipe</h3>${state.announcements.map(a=>`<div class="row"><time>${fmt(a.createdAt)}</time><h4>${esc(a.title)}</h4><p>${esc(a.body)}</p></div>`).join("")}</div><div class="panel"><h3>Votre confidentialité</h3><p>Votre profil reste privé. Les photos ne sont révélées qu’après votre accord et la confirmation de l’équipe.</p><button class="btn pink" onclick="state.view='photos';userPage()">Ajouter mes 3 photos</button></div></div>`;root.innerHTML=shell(items,content);document.getElementById("message")?.addEventListener("submit",sendMessage)}
    async function sendMessage(e){e.preventDefault();try{await api("/api/messages",{method:"POST",body:JSON.stringify({body:new FormData(e.target).get("body")})});await loadUser();toast("Message envoyé.",true);userPage()}catch(x){toast(x.message)}}
    function fileData(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL("image/jpeg",0.85))};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Image illisible."))};img.src=url})}
    async function savePhotos(){const files=[...(document.getElementById("photos")?.files||[])];if(files.length!==3)return toast("Sélectionnez exactement trois photos.");try{state.user=await api("/api/profile/photos",{method:"POST",body:JSON.stringify({photos:await Promise.all(files.map(fileData))})});toast("Photos enregistrées.",true);userPage()}catch(x){toast(x.message)}}
    async function loadAdmin(){[state.users,state.messages,state.announcements,state.logs,state.mail]=await Promise.all([api("/api/admin/users"),api("/api/messages"),api("/api/announcements"),api("/api/admin/email-logs"),api("/api/admin/mail-config")])}
    function adminPage(){const i=state.view;const items=`<button class="${i==="dashboard"?"active":""}" onclick="state.view='dashboard';adminPage()">Tableau de bord</button><button class="${i==="users"?"active":""}" onclick="state.view='users';adminPage()">Profils inscrits</button><button class="${i==="mail"?"active":""}" onclick="state.view='mail';adminPage()">Envoi des codes</button><button class="${i==="logs"?"active":""}" onclick="state.view='logs';adminPage()">Journal des emails</button>`;let content=`<div class="welcome"><div><span class="kicker">Espace équipe</span><h2>Bonjour, équipe.</h2><p>Validez les demandes et contrôlez l’envoi des codes.</p></div><span class="pill">Administration</span></div>`;if(i==="users")content+=`<div class="panel"><h3>Personnes inscrites</h3><p>Confirmez un profil pour générer et envoyer son code de connexion.</p><div class="table-wrap"><table class="table"><thead><tr><th>Nom</th><th>Email</th><th>État</th><th>Action</th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${esc(u.firstName+" "+u.lastName)}</b></td><td>${esc(u.email)}</td><td class="${u.status==="pending"?"pending":"active-txt"}">${u.status==="pending"?"En attente":"Confirmé"}</td><td>${u.status==="pending"?`<button class="btn blue small" onclick="approve(${u.id})">Confirmer et envoyer</button>`:"<span class=\"muted\">Déjà confirmé</span>"}</td></tr>`).join("")||"<tr><td colspan=4>Aucun inscrit.</td></tr>"}</tbody></table></div></div>`;else if(i==="mail")content+=mailSettings();else if(i==="logs")content+=`<div class="panel"><h3>Journal des emails</h3><p>Chaque tentative d’envoi est enregistrée. Les brouillons de réinitialisation peuvent être ouverts par l’administrateur.</p>${state.logs.map(l=>`<div class="log"><strong>${esc(l.recipient)} · ${esc(l.provider)}${l.kind==="password_reset"?" · Réinitialisation":""}</strong><span>${esc(l.subject)} · ${fmt(l.createdAt)} · <b class="${l.status}">${l.status==="sent"?"Envoyé":l.status==="failed"?"Échec":"Brouillon"}</b>${l.failureReason?" — "+esc(l.failureReason):""}</span>${l.gmailUrl?`<br><a class="btn light small" href="${esc(l.gmailUrl)}" target="_blank" rel="noopener">Ouvrir le brouillon Gmail</a>`:""}</div>`).join("")||"<p>Aucun email préparé pour le moment.</p>"}</div>`;else content+=`<div class="metrics"><div class="metric"><strong>${state.users.length}</strong><span>profils inscrits</span></div><div class="metric"><strong>${state.users.filter(u=>u.status==="pending").length}</strong><span>demandes à valider</span></div><div class="metric"><strong>${state.logs.filter(l=>l.status==="sent").length}</strong><span>codes envoyés</span></div></div><div class="panel"><h3>Mode d’envoi actuel</h3><p>${state.mail.mode==="mailgun"?"Mailgun API — les codes sont envoyés automatiquement après vérification.":"Envoi manuel — un brouillon Gmail est préparé après confirmation."}</p><button class="btn blue" onclick="state.view='mail';adminPage()">Gérer l’envoi</button></div>`;root.innerHTML=shell(items,content)}
    function mailSettings(){const m=state.mail||{mode:"manual",domain:"",baseUrl:"https://api.mailgun.net"};return `<div class="panel"><h3>Choisir l’envoi des codes</h3><p>Le mode manuel prépare un message Gmail. Le mode Mailgun vérifie vos trois paramètres avant de les enregistrer.</p><form id="mailForm" class="mail-box"><div class="field"><label>MODE D’ENVOI</label><select id="mode" name="mode"><option value="manual" ${m.mode==="manual"?"selected":""}>Envoi manuel par Gmail</option><option value="mailgun" ${m.mode==="mailgun"?"selected":""}>API Mailgun</option></select></div><div id="mailFields" class="${m.mode==="mailgun"?"":"hidden"}"><div class="mail-fields"><div class="field"><label>CLÉ API MAILGUN</label><input name="apiKey" type="password" placeholder="${m.apiKeyConfigured?"Clé déjà enregistrée — saisir pour la remplacer":"Votre clé API"}></div><div class="field"><label>DOMAINE MAILGUN</label><input name="domain" value="${esc(m.domain||"")}" placeholder="sandbox…mailgun.org"></div><div class="field full"><label>URL DE BASE</label><input name="baseUrl" value="${esc(m.baseUrl||"https://api.mailgun.net")}" placeholder="https://api.mailgun.net"></div></div></div><div id="mailError"></div><button class="btn blue" style="margin-top:15px">Vérifier et enregistrer</button></form><p class="muted" style="margin-top:14px">La clé API n’est jamais affichée et est chiffrée avant d’être conservée.</p></div>`}
    document.addEventListener("change",e=>{if(e.target.id==="mode")document.getElementById("mailFields")?.classList.toggle("hidden",e.target.value!=="mailgun")});
    async function saveMail(e){e.preventDefault();const f=new FormData(e.target);try{const r=await api("/api/admin/mail-config/test",{method:"POST",body:JSON.stringify(Object.fromEntries(f))});state.mail=r.config;toast(r.message,true);adminPage()}catch(x){document.getElementById("mailError").innerHTML=`<div class="alert">${esc(x.message)}</div>`}}
    async function approve(id){try{const r=await api("/api/admin/users/"+id+"/approve",{method:"POST"});if(r.sent){toast("Profil confirmé et code envoyé par Mailgun.",true)}else if(r.email?.gmailUrl){window.open(r.email.gmailUrl,"_blank");toast("Profil confirmé. Le brouillon Gmail est prêt.",true)}await loadAdmin();state.view="users";adminPage()}catch(x){toast(x.message)}}
    async function logout(){await api("/api/auth/logout",{method:"POST"});state.user=null;state.role=null;go("")}
    function home(){root.innerHTML=`<div class="page"><div class="wrap"><nav class="nav"><a class="brand" href="#"><span class="mark">♡</span>Cœur & Connexions</a><div class="actions"><a class="btn light" href="#connexion">Se connecter</a><a class="btn primary" href="#inscription">Créer mon espace →</a></div></nav><section class="hero"><div><span class="kicker">Une rencontre plus humaine</span><h1>Les belles histoires commencent <em>en douceur.</em></h1><p class="lead">Un espace privé pour faire connaissance avec plus d’intention, de discrétion et de sérénité. Ici, pas de défilement sans fin : seulement des liens choisis.</p><div class="actions" style="margin-top:26px"><a class="btn primary" href="#inscription">Commencer mon histoire →</a><a class="btn light" href="#connexion">J’ai déjà un compte</a></div></div><div class="hero-art"><div class="art"></div><div class="float f1"><strong>100% confidentiel</strong><small>Votre espace reste privé</small></div><div class="float f2"><strong>Une vraie intention.</strong><small>Pas un simple swipe.</small></div></div></section><section class="footer"><span>© 2026 Cœur & Connexions</span><span>Votre vie privée reste au centre.</span></section></div></div>`}
    async function render(){const route=location.hash.slice(1);if(!route)return home();if(route==="connexion")return login();if(route==="inscription")return register();if(route==="mot-de-passe-oublie")return forgotPassword();if(route==="admin"||route==="espace"){try{if(!state.user){state.user=await api("/api/me");state.role=route==="admin"?"admin":"user"}if(route==="admin"||state.role==="admin"){await loadAdmin();return adminPage()}await loadUser();return userPage()}catch(_e){return go("connexion")}}return go("")}
    window.addEventListener("hashchange",render);
    document.addEventListener("submit",e=>{if(e.target.id==="mailForm")saveMail(e)});
    document.addEventListener("click",e=>{
      if(window.progressBypass||window.progressBusy)return;
      const target=e.target.closest("button,a");
      if(!target||target.closest("#progressOverlay")||target.disabled||target.dataset.progressIgnore==="true")return;
      e.preventDefault();
      e.stopImmediatePropagation();
      runWithProgress(target);
    },true);
    window.addEventListener("DOMContentLoaded",render);
  </script>
</body>
</html>
